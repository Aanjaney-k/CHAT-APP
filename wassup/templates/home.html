<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat App</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",sans-serif;
}

body{
    background:#edf2f7;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* Chat Window */

.chat-app{
    width:900px;
    height:650px;
    background:#ffffff;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 15px 40px rgba(0,0,0,.15);
    display:flex;
    flex-direction:column;
}

/* Header */

.chat-header{
    background:#105432;
    color:white;
    padding:18px 25px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.chat-header .title{
    font-size:22px;
    font-weight:600;
}

.chat-controls{
    display:flex;
    align-items:center;
    gap:12px;
}

.chat-controls label{
    font-size:15px;
}

.chat-controls select{
    padding:8px 12px;
    border:none;
    border-radius:8px;
    outline:none;
    font-size:14px;
    cursor:pointer;
}

.chat-controls a{
    color:white;
    text-decoration:none;
    background:#ef4444;
    padding:8px 14px;
    border-radius:8px;
    transition:.3s;
}

.chat-controls a:hover{
    background:#dc2626;
}

/* Chat Messages */

#chatbox{
    flex:1;
    overflow-y:auto;
    background:#b4b8bd;
    padding:25px;
}

/* Message Bubble */

.bubble{
    max-width:65%;
    padding:12px 16px;
    border-radius:18px;
    margin-bottom:15px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
    line-height:1.5;
    word-break:break-word;
}

.sent{
    margin-left:auto;
    background:#3b6046;
    color:white;
    border-bottom-right-radius:5px;
}

.received{
    margin-right:auto;
    background:white;
    color:#333;
    border-bottom-left-radius:5px;
}

.label{
    display:block;
    font-size:12px;
    font-weight:bold;
    margin-bottom:5px;
    opacity:.75;
}

/* Input */

.chat-input{
    display:flex;
    gap:15px;
    padding:20px;
    border-top:1px solid #ddd;
    background:white;
}

.chat-input input{
    flex:1;
    padding:14px 18px;
    border:1px solid #ccc;
    border-radius:30px;
    outline:none;
    font-size:15px;
}

.chat-input input:focus{
    border-color:#000000;
}

.chat-input button{
    background:#136f27;
    color:white;
    border:none;
    padding:14px 28px;
    border-radius:30px;
    cursor:pointer;
    font-size:15px;
    transition:.3s;
}

.chat-input button:hover{
    background:#203623;
}

</style>

</head>

<body>

<div class="chat-app">

    <div class="chat-header">

        <div class="title">
            {{ username }}
        </div>

        <div class="chat-controls">

            <label>Chat with</label>

            <select id="receiver">
                {% for user in other_users %}
                <option value="{{ user }}">{{ user }}</option>
                {% endfor %}
            </select>

            <a href="{% url 'logout' %}">Logout</a>

        </div>

    </div>

    <div id="chatbox"></div>

    <div class="chat-input">

        <input
            type="text"
            id="message"
            placeholder="Type your message..."
        >

        <button id="send">
            Send
        </button>

    </div>

</div>

<script>

const CURRENT_USER = "{{ username }}";

const receiver = document.getElementById("receiver");
const message = document.getElementById("message");
const chatbox = document.getElementById("chatbox");
const sendBtn = document.getElementById("send");

let socket;

function appendMessage(data){

    const isMine = data.sender === CURRENT_USER;

    const bubble = document.createElement("div");
    bubble.className = "bubble " + (isMine ? "sent" : "received");

    const label = document.createElement("span");
    label.className = "label";
    label.textContent = isMine ? "You" : data.sender;

    bubble.appendChild(label);
    bubble.appendChild(document.createTextNode(data.message));

    chatbox.appendChild(bubble);
    chatbox.scrollTop = chatbox.scrollHeight;

}

function loadHistory(){

    chatbox.innerHTML="";

    fetch("/history/" + CURRENT_USER + "/" + receiver.value + "/")
    .then(res=>res.json())
    .then(data=>{
        data.messages.forEach(appendMessage);
    });

}

function connectSocket(){

    if(socket){
        socket.close();
    }

    loadHistory();

    socket=new WebSocket(
        "ws://"+window.location.hostname+":8000/ws/chat/"+CURRENT_USER+"/"
    );

    socket.onopen=function(){
        console.log("Connected");
    };

    socket.onmessage=function(event){

        const data=JSON.parse(event.data);

        appendMessage(data);

    };

    socket.onclose=function(){
        console.log("Disconnected");
    };

}

connectSocket();

receiver.onchange=function(){

    loadHistory();

};

sendBtn.onclick=function(){

    if(message.value.trim()=="")
        return;

    socket.send(JSON.stringify({

        receiver:receiver.value,
        message:message.value

    }));

    message.value="";

};

message.addEventListener("keydown",function(e){

    if(e.key==="Enter"){
        sendBtn.click();
    }

});

</script>

</body>
</html>
